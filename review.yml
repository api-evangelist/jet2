      for "jet2 airline" returns three third-party projects
      (Ritesh0100/Jet2_Sentiment, bpp-sot/fuel-anomaly-pipeline,
      IdeaAnalytics/Jet2TT---Data-Science-CoE), none first-party. Third-party
