  - url: https://support.travelport.com/webhelp/Smartpoint1G1V/Content/Air/TAS/Jet2.htm
    status: '200'
    note: >-
      PRIMARY EVIDENCE. Travelport's own Smartpoint documentation for Jet2.
      States "Jet2 is supported in Smartpoint as a Direct Payment Carrier",
      carrier code LS. Constraints documented: maximum 13 passengers per
      booking (9 on Travelport+ and Apollo); point-to-point only, "connecting
      flights are not supported"; maximum 8 destinations for multi-city;
      supported currencies GBP, EUR, CHF, CZK, PLN, USD; restricted forms of
      payment with mandatory CVV; and no post-booking modification or
      cancellation through the system — "Requests for changes must be made
      directly through Jet2." Supported functions are fare shopping, pricing,
      booking, seat maps and ancillaries.
