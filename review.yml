aid: jet2
name: Jet2
review:
  question: Does Jet2 publish a public, self-serve developer portal or downloadable
    API specifications, and what would it cost a travel seller to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: airline
  gated: true
findings:
  summary: |
    Jet2 plc is a British leisure travel group listed on the London Stock
    Exchange as JET2 (formerly Dart Group plc). It runs Jet2.com, the UK's
    third-largest airline (IATA code LS, ICAO code EXS), and Jet2holidays, the
    UK's largest ATOL holder. Its registered identity was confirmed
    independently of any Jet2 web page: the Extended Validation TLS certificate
    served by www.jet2.com carries subject "businessCategory=Private
    Organization; serialNumber=02739537; jurisdictionCountryName=GB; C=GB;
    ST=West Yorkshire; L=Yeadon; street=Low Fare Finder House, Leeds Bradford
    Airport; O=JET2.COM LIMITED; CN=www.jet2.com", issued by GlobalSign ECC EV
    SSL CA 2018, valid 2026-06-29 to 2027-01-14.

    Jet2 publishes NO developer portal, NO API reference documentation and NO
    machine-readable API contract of any kind. It also publishes far less about
    the commercial shape of its distribution relationships than easyJet does —
    there is no Jet2 equivalent of easyJet's Distribution Charter and no
    published list of approved channels.

    Two Jet2 distribution APIs demonstrably exist in production and neither is
    documented by Jet2:

      1. The Jet2.com flight distribution API, reached by travel sellers
         through Kyte. On 24 June 2025 Jet2.com and Kyte announced a
         distribution agreement putting Jet2.com seats and the full ancillary
         range (luggage, seat selection, priority boarding) onto the Kyte
         platform, connecting the airline to travel management companies and
         corporate booking tools. Kyte describes its product, Kyte Direct
         Connect (KDC), as "a powerful, flexible, JSON/REST API that supports
         full airline content and functionality from both NDC and LCC
         airlines", and as "a modern API that standardises airline NDC and LCC
         proprietary content". Jet2 content from Kyte is also surfaced on
         partner desktop solutions such as AirGateway. Doug Turner, General
         Manager of 3rd Party Supply & Distribution at Jet2.com, is the named
         executive on the deal.

      2. The Jet2holidays agency API, which lets independent travel agencies
         sell Jet2holidays packages on their own websites and take the agreed
         commission. Trade press reporting on the trial (with Dawson &
         Sanderson among the key independent partners) states that "agencies
         that want to use the API to its full potential must already have
         bookable websites", that agencies without bookable sites can display
         Jet2holidays packages as search results with a call-to-action phone
         number instead, and that companies can sign up to use the API direct
         with Jet2holidays or via third-party technology suppliers.

    The NDC finding is the sector-relevant one, and it is a negative. Jet2 is
    NOT an NDC carrier. It does not appear on Duffel's published list of
    NDC-certified airlines. No NDC certification level or ARM index entry was
    found. ndc.jet2.com does not resolve, and no NDC endpoint, schema or
    message set is published anywhere. Kyte's own positioning separates "NDC"
    from "LCC proprietary content", and every piece of evidence places Jet2 on
    the LCC proprietary side of that line. Jet2.com is one of the carriers that
    never had a GDS dependency to escape, so IATA's remedy for GDS
    intermediation was never a problem it needed to solve. Travelport's own
    documentation confirms the shape: Jet2 is supported in Smartpoint as a
    "Direct Payment Carrier", Travelport's low-cost-carrier workaround, not as
    a normal EDIFACT GDS participant.

    Machine access to jet2.com and jet2holidays.com is itself a finding.
    Both are fronted by Akamai (www.jet2.com -> www.jet2.com.edgekey.net ->
    e4481.a.akamaiedge.net) with bot management that terminates HTTP/2 streams
    with INTERNAL_ERROR and drops HTTP/1.1 requests entirely. Every HTML page
    on both domains returned HTTP 000 (no response) to every client tried,
    including curl with a full browser header set and the WebFetch tool, which
    timed out. Exactly one static asset came back: https://www.jet2.com/robots.txt
    returned HTTP 200 once, on 2026-07-28, and is quoted verbatim below;
    subsequent requests to the same URL were blocked. Any claim about Jet2's
    published web content in this record is therefore sourced from
    search-engine indexes and trade press, not from a page fetched here, and is
    labelled as such.

    A real API hostname exists and is empty. api.jet2.com resolves via
    api.lb.jet2.com to 62.190.131.177, answers HTTP 200 over HTTP/1.1, and
    serves nothing but the stock "IIS Windows Server" default page — 703 bytes,
    Server: Microsoft-IIS/10.0, X-Powered-By: ASP.NET, Last-Modified: Mon, 09
    May 2022 19:32:47 GMT. /swagger, /swagger/index.html, /openapi.json,
    /swagger.json, /api-docs and /.well-known/openapi.json all return 404 from
    the same IIS instance. b2b.jet2.com answers HTTP 200 with a Microsoft ADFS
    "Sign in with your organizational account" form (page footer "© 2016
    Microsoft") — an internal identity provider, not a developer portal.
    api.jet2holidays.com resolves via api.lb.jet2holidays.com to 62.190.131.199
    but does not answer. portal.jet2.com resolves to 193.131.170.242 and resets
    the TLS connection. booking.jet2.com (165.160.15.20 / 165.160.13.20),
    booking.jet2holidays.com (62.190.130.188) and dev.jet2holidays.com
    (212.240.242.231 / 62.6.222.186) all time out.

    One hygiene observation, recorded but not exploited:
    agent.jet2holidays.com is a CNAME to
    prod-uks-jet2-appservice-website.azurewebsites.net, and that Azure App
    Service name has no A record — a dangling CNAME to a deallocated Azure Web
    App. This is a subdomain-takeover exposure pattern. It was observed by DNS
    lookup only; nothing was registered, claimed or requested.

    There is no official Jet2 GitHub organisation. github.com/jet2,
    /jet2plc, /jet2com, /jet2-com and /dartgroup all return 404. A GitHub
    repository search for "jet2 airline" returns three third-party projects
    (sentiment-analysis and fuel-anomaly exercises), none of them first-party
    and none of them a Jet2 interface. Third-party flight-data products
    marketed as a "Jet2.com API" (AirLabs, Aviationstack, FlightAware AeroAPI)
    are other companies' APIs that happen to cover LS/EXS flights; they are
    deliberately NOT listed as Jet2 APIs.
