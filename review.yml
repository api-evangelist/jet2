actions:
  apisYmlUpdated: true
  openapiHarvested: false
  specsSaved: 0
  reason: >-
    Recorded as an honest stub with a full switching-cost record. Jet2 operates
    at least two real production distribution APIs — the Jet2.com flight API
    reached through Kyte Direct Connect and the Jet2holidays agency API used by
    independent agencies — and publishes nothing about either: no developer
    portal, no reference documentation, no machine-readable specification, no
    authentication metadata, no webhook catalogue and no GitHub organisation.
    apis[] is intentionally empty because listing an undocumented hostname, or a
    partner's API as if it were Jet2's, would be fabrication. No openapi/
    directory was created because no real spec was found. The value of this
    record is the switchingCost block: Jet2 is the UK travel seam's clearest case
    of a carrier that never adopted a distribution standard because it never had
    the GDS dependency the standard was invented to break — and whose lock-in is
    consequently pure private contract, published nowhere, reusable nowhere.
