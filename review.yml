      airlines hold certifications". Jet2 (LS) does not appear. Among low-cost
      carriers only Southwest and Spirit (Level 3) and Pegasus (Level 4) are
      listed.
  - url: https://www.gokyte.com/faqs/
    status: '200'
    note: >-
      PRIMARY EVIDENCE for the access gate. "Access to airline products is
      controlled by each airline. Kyte provides only technical connectivity
      through the KDC Network. Airlines and distribution partners are free to
      negotiate product and commercial terms."
  - url: https://gokyte.tech/
    status: '200'
    note: >-
      Kyte product site. "Modern airline API for LCC and NDC distribution."
      Kyte Direct Connect (KDC) described as "a powerful, flexible, JSON/REST
      API that supports full airline content and functionality from both NDC
      and LCC airlines."
  - url: https://thebusinesstravelmag.com/jet2-com-and-kyte-to-distribute-seats-and-content-via-api/
    status: '200'
    note: >-
      Trade press on the June 2025 agreement. "Kyte provides a modern API that
      standardises airline NDC and LCC proprietary content." Travel sellers get
      "access to an application programming interface (API)-driven user journey
      when searching and booking Jet2.com flights and ancillaries." Jet2.com
      content from Kyte "will also be made available on partner's desktop
      solutions, such as AirGateway."
  - url: https://www.travolution.com/news/jet2.com-signs-distribution-agreement-with-kyte/
    status: '200'
    note: >-
      Names Doug Turner, General Manager of 3rd Party Supply & Distribution at
      Jet2.com: "We are very excited about this partnership, which enables us
      to offer our award-winning flights and product to even more markets and
      customers."
  - url: https://www.travolution.com/news/travel-sectors/tour-operators/jet2holidays-tech-lets-agents-sell-direct-via-their-websites/
    status: '200'
    note: >-
      PRIMARY EVIDENCE for the Jet2holidays agency API. The API lets consumers
      book Jet2holidays packages directly on independent agencies' websites
