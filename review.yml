  regulatory:
    regime: >-
      UK CAA operating licence and ATOL licensing (Jet2holidays is the UK's
      largest ATOL holder, licensed for approximately 7 million passengers);
      UK GDPR / Data Protection Act 2018; the Package Travel and Linked Travel
      Arrangements Regulations; the ABTA Code of Conduct (Jet2holidays ABTA
      number Y1256); UK261/EU261 passenger rights.
    openDataMandate: none
    note: >-
      Nothing in UK law compels an airline or a tour operator to publish a
      distribution API or a machine-readable contract. The only portability
      obligation that could bite is UK GDPR Article 20 — and unlike easyJet,
      Jet2 publishes no retrievable statement of how it implements it, because
      its privacy notice could not be fetched by any automated client.
switchingCost:
  interfaceShape:
    value: proprietary-undocumented
    standardNamed: none
    evidence: >-
      No standard is referenced anywhere. Jet2 is absent from Duffel's list of
      NDC-certified airlines; no IATA NDC certification level or ARM index entry
      was found; ndc.jet2.com does not resolve; no NDC XML message set, no
      OpenTravel/OTA schema, no HTNG reference and no OpenAPI document exists.
      Kyte, the channel Jet2 actually chose, explicitly distinguishes "NDC" from
      "LCC proprietary content" and markets KDC as normalising BOTH — which
      places Jet2 on the proprietary side of Kyte's own dividing line. Travelport
      reaches Jet2 only as a "Direct Payment Carrier", its low-cost-carrier
      bolt-on, not as a normal EDIFACT participant. The two Jet2 APIs that
      demonstrably exist — the flight distribution API behind Kyte and the
      Jet2holidays agency API — have no published protocol, base URL, operation,
      schema, authentication scheme, scope or rate limit. api.jet2.com serves an
      IIS default page.
    note: >-
      This is the single most important switching-cost signal in the record, and
      Jet2 scores at the worst end of it. A seller integrating Jet2 is building
      against a shape only Jet2 defines, that no other party implements, and that
      Jet2 has never described in public. Nothing in the integration is portable
      to another carrier. Worse than easyJet, which at least publishes the
      commercial charter governing access: Jet2 publishes neither the interface
      nor the contract.
  secondSource:
    value: few-alternatives
    alternativesConsidered:
    - name: Kyte (Kyte Direct Connect / KDC)
      note: >-
        The named channel since the June 2025 distribution agreement. JSON/REST
        API normalising NDC and LCC proprietary content. Kyte's FAQ states it
        provides "only technical connectivity" and that airlines control product
        access and negotiate commercial terms separately.
    - name: AirGateway
      note: >-
        Downstream desktop surface carrying Jet2.com content sourced from Kyte —
        not an independent route to Jet2, a re-presentation of the Kyte route.
    - name: Travelport (Smartpoint, Direct Payment Carrier)
      note: >-
        A genuine second route, but a materially degraded one: point-to-point
        only, no connecting flights, 13-passenger cap (9 on Travelport+/Apollo),
        restricted currencies and forms of payment, and NO post-booking change
        or cancellation — those must go direct to Jet2. Not equivalent capability.
    - name: Direct agreement with Jet2holidays (agency API)
      note: >-
        Available to agencies with an already-bookable website; sign-up is direct
        with Jet2holidays or via a third-party technology supplier. Covers
        Jet2holidays packages, not Jet2.com flight-only distribution.
    - name: Amadeus
      note: >-
        Light ticketing for carriers like Jet2.com is referenced in industry
        material, but no Jet2 content agreement or capability matrix is published
        by either party. Not counted as a verified route.
    - name: Sabre
      note: No published Jet2 content agreement found. Not a verified route.
    - name: Duffel
      note: >-
        The UK's API-first booking layer and the obvious candidate. No Jet2 (LS)
        support is published on Duffel's airline pages, and Jet2 is absent from
        Duffel's NDC-certified list. Not a route.
    - name: Third-party flight-data APIs (AirLabs, Aviationstack, FlightAware AeroAPI)
      note: >-
        Cover LS/EXS schedule and status data only. They cannot sell a seat and
        are not a distribution alternative at all.
    evidence: >-
      Jet2 publishes no approved-channel list, so unlike easyJet there is no
      first-party enumeration to compare against. The routes above were assembled
      from Travelport's own Smartpoint documentation, Kyte's product site and
      FAQ, and trade press on the June 2025 Kyte agreement and the Jet2holidays
      agency API trial.
    note: >-
      Read carefully this is two answers. For Jet2's own seat and package
      inventory there is NO second source — only Jet2 sells Jet2, and that is the
      finding, not an evasion. For the ROUTE to that inventory there are three
      verifiable options (Kyte, Travelport as a Direct Payment Carrier, and a
      direct Jet2holidays agreement), and they are not equivalent: the Travelport
      route cannot service a booking after it is made. Three unequal routes with
      no published list, versus easyJet's fourteen published and graded channels,
      is why this scores few-alternatives rather than
      alternatives-with-migration.
  exitPath:
    value: no-export-published
    operationCited: none
    evidence: >-
      No export, dump, bulk, reporting or data-portability operation is published,
      because no API is published. No privacy notice, data-protection page or
      subject-access mechanism could be retrieved from jet2.com or
      jet2holidays.com — every HTML page on both domains returned HTTP 000 to
      every automated client tried. No data.protection@ contact address was
      found in any retrievable source.
    note: >-
      UK GDPR Article 20 applies to Jet2 as a matter of law and a passenger can
      certainly make a portability request. But this field records what is
      PUBLISHED and verifiable, and nothing was: no documented export operation,
      no stated scope of portable data, no named contact, and no retrievable
      commitment of any kind. For a travel agency or corporate customer there is
      no published mechanism whatsoever to extract its own Jet2 booking book.
      Scored no-export-published, one band below easyJet, which does publish a
      scoped Article 20 commitment with a worked example and a named mailbox.
  identifierPortability:
    summary: >-
      Shared IATA/ICAO codes on the surface; a proprietary Jet2 booking key
      underneath that Travelport itself cannot service.
    identifiersFound:
    - identifier: IATA airline designator LS
      portable: true
      evidence: >-
        Used as the carrier code in Travelport's Smartpoint documentation for
        Jet2 and across industry references.
    - identifier: ICAO airline designator EXS
      portable: true
      evidence: Jet2.com ICAO code, used in flight-tracking and schedule data.
    - identifier: IATA 3-letter airport codes
      portable: true
      evidence: Standard across all schedule, booking and tracking surfaces.
    - identifier: Jet2 booking reference
      portable: false
      evidence: >-
        Travelport documents that Jet2 bookings made through Smartpoint cannot be
        modified or cancelled in the GDS — "Requests for changes must be made
        directly through Jet2." The authoritative record lives in Jet2's own
        system, not in a GDS PNR that another party can service.
    - identifier: ATOL certificate number / ABTA number Y1256
      portable: partial
      evidence: >-
        UK regulatory identifiers attached to Jet2holidays as principal. They
        identify the protection scheme, not a machine-readable booking key, and
        do not transfer a booking to anyone else.
    - identifier: IATA/ARC agency accreditation number
      portable: notRequired
      evidence: >-
        Nothing found requires IATA or ARC accreditation to sell Jet2. The
        Jet2holidays agency route is described in terms of UK trade
        qualifications — ATOL Regulations, the Package Travel Regulations and the
        ABTA Code of Conduct — and a bookable website, not an IATA numeric code.
        Jet2 does not distribute through interline ticketing, so the portable
        IATA ticket number never enters the picture at all.
    note: >-
      The lookup keys travel; the commercial key does not. There is no published
      cross-reference between a Jet2 booking reference and a GDS record locator
      or an IATA ticket number, and Travelport's own documentation concedes that
      the GDS cannot service the booking after creation. That is the sharpest
      identifier-portability finding available here: even the intermediary that
      holds the record cannot act on it.
  contractualLockIn:
    published: partially
    documentsIdentified:
    - name: Jet2holidays Limited standard agency agreement (April 2025)
      url: https://www.jet2holidays.com/-/media/pdfs/agency%20agreement_april_2025.pdf
      retrieved: false
      status: '000'
    - name: Jet2holidays Limited standard agency agreement (effective 26 May 2021)
      url: https://www.jet2holidays.com/-/media/pdfs/new_agencyagreement_jet2holidays.pdf
      retrieved: false
      status: '000'
    verbatim: []
    note: >-
      NOTHING IS QUOTED HERE BECAUSE NOTHING WAS READ. A published standard
      agency agreement demonstrably exists — two versions of it are indexed at
      the URLs above — and it is the document that would answer this question.
      Both are served from jet2holidays.com behind Akamai bot management and both
      returned HTTP 000 to curl and timed out in WebFetch. Search-engine
      summaries indicate the agreement obliges agents to comply with UK travel
      legislation including the ATOL Regulations, the Package Travel Regulations,
      the Consumer Protection from Unfair Trading Regulations, UK GDPR, the Data
      Protection Act 2018 and the ABTA Code of Conduct — but that is a
      third-party paraphrase of a document this review never opened, and it is
      recorded as unverified, not as a citation. No clause text, clause number,
      term length, notice period, exclusivity provision, commission rate,
      termination right or amendment right is asserted anywhere in this record.
    notPublishedOrNotVerifiable:
    - Minimum term or contract length
    - Notice period on termination
    - Exclusivity, full-content or minimum-volume obligations
    - Per-segment, per-booking or per-passenger fees
    - Commission rates or incentive structure
    - Unilateral amendment rights
    - Data ownership or data return on termination
    - Service-level or uptime commitments
    - Any pricing or eligibility criteria for a direct API agreement
    - >-
      Any Jet2 equivalent of easyJet's Distribution Charter — no public
      distribution policy, no approved-channel list, no acceptable-use policy for
      resellers was found at any Jet2 URL.
  accessGate:
    value: commercial-agreement
    selfServe: false
    whatADeveloperMustSign: >-
      There is no published application route of any kind. In practice a travel
      seller takes one of three paths, all commercial and all bilateral. (1) A
      commercial agreement with Kyte for Kyte Direct Connect, on top of which
      Jet2 still controls product access — Kyte's FAQ states plainly that
      "Access to airline products is controlled by each airline. Kyte provides
      only technical connectivity through the KDC Network. Airlines and
      distribution partners are free to negotiate product and commercial terms."
      (2) A Travelport agreement, which reaches Jet2 only as a Direct Payment
      Carrier with the documented capability gaps. (3) A direct Jet2holidays
      agency agreement under the published standard agency agreement, which
      requires the agency to hold UK trade qualifications (ATOL Regulations, the
      Package Travel Regulations, the ABTA Code of Conduct) and — for the API
      specifically — to already operate a bookable website. No IATA or ARC
      accreditation is named as a requirement anywhere. There is no sandbox, no
      trial, no self-serve API key, no published rate limits, no published
      contact address for API access and no published pricing. b2b.jet2.com is a
      Microsoft ADFS organisational-account login with no registration path.
    note: >-
      Jet2 publishes neither how to apply nor what you agree to. easyJet at least
      names its approved channels and publishes the behavioural terms; Jet2
      publishes a trade marketing site. For a developer the practical answer is
      that you cannot get in without a signed commercial relationship you must
      initiate by telephone or email through a channel partner.
  distributionModel:
    value: aggregator-reseller
    detail: >-
      Predominantly direct-to-consumer through jet2.com, jet2holidays.com and the
      Jet2 app, with more than 63% of flown passengers buying an end-to-end
      package holiday from the group itself. Agency reach is delivered through
      more than 2,500 independent UK travel agent partners transacting on Jet2's
      own trade site and, for those with bookable websites, through the
      Jet2holidays agency API. Third-party flight distribution to TMCs and
      corporate booking tools arrived only in June 2025 through Kyte, with
      downstream desktop presentation via AirGateway. Travelport carries Jet2 in
      Smartpoint as a Direct Payment Carrier. Jet2.com never filed fares into the
      GDS rail as a normal EDIFACT participant, and the GDSes reach it on Jet2's
      terms rather than the other way round.
  ndcPosture:
    isNdc: false
    certificationLevelClaimed: none
    ndcApiPublished: false
    gdsSurchargeVerified: false
    evidence: >-
      Jet2 (LS) does not appear on Duffel's published list of NDC-certified
      airlines, which covers "60+ airlines"; among low-cost carriers only
      Southwest, Spirit and Pegasus are listed there. No IATA NDC certification
      level, NDC Registry entry or Airline Retailing Maturity (ARM) index entry
      was found for Jet2. ndc.jet2.com does not resolve and no NDC endpoint,
      schema or message set is published anywhere. The June 2025 Kyte
      announcement describes Kyte as normalising "airline NDC and LCC proprietary
      content" without ever placing Jet2 in the NDC category. Travelport supports
      Jet2 as a "Direct Payment Carrier", its LCC mechanism, not via NDC. No GDS
      surcharge or GDS-booking fee levied by Jet2 was found published anywhere —
      the question does not arise in the way it does for British Airways, because
      Jet2 has no full-content GDS agreement to surcharge away from.
    note: >-
      This is the structurally important fact about Jet2 in the UK travel seam,
      and it is the same fact as easyJet's. NDC exists to let full-service
      carriers escape GDS intermediation. Jet2.com never had that dependency —
      it was built direct, sold direct, and bundled the seat into its own package
      holiday, so IATA's remedy addresses a problem it never had. The consequence
      for switching cost is severe and under-appreciated: because Jet2 never
      adopted a standard, the lock-in it creates is private-contract lock-in
      rather than standard-mediated lock-in, and NO part of a Jet2 integration is
      reusable against another carrier. The industry narrative treats NDC
      adoption as the measure of a carrier's distribution modernity; carriers like
      Jet2 show that the more consequential variable is whether any published
      standard governs the interface at all.
  consumerVsDistributionSurface:
    consumer:
      apisPublished: false
      note: >-
        Flight status, check-in, boarding passes, manage-my-booking and the
        myJet2 account are delivered through jet2.com and the Jet2 app only.
        robots.txt disallows /managebasket/*, /mobile/*, /low-fare-finder/ and
        /uploadedcontent/*. No consumer API is published. Third parties
        (AirLabs, Aviationstack, FlightAware AeroAPI) sell LS/EXS flight-status
        coverage, but those are their APIs, not Jet2's.
    distribution:
      apisPublished: false
      apisExist: true
      note: >-
        Two production distribution APIs exist and neither is documented. The
        Jet2.com flight API is reached by travel sellers through Kyte Direct
        Connect and surfaced on AirGateway; the Jet2holidays agency API lets
        independent agencies sell packages on their own bookable websites for
        commission. api.jet2.com and api.jet2holidays.com are the two real
        first-party API hostnames — the first serves a bare IIS default page,
        the second does not answer.
