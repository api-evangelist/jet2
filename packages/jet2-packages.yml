summary: >-
  Jet2 publishes exactly two public first-party software packages, both on npm
  under the @jet2 scope, both owned by the npm maintainer account "jet2", and
  both pointing at Jet2's own Azure DevOps organisation
  (jet2tfs.visualstudio.com/Jet2Digital) as their source repository. NEITHER is
  an API client library. They are front-end design-system artefacts — a
  design-token build and an early React component library — published to npm so
  Jet2's own web properties can consume them. Both were published in April 2024
  and neither has been updated since. No Jet2 SDK exists for any language on
  npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or
  crates.io, because Jet2 publishes no API for an SDK to wrap. No `SDKs`
  pointer is emitted for this artifact: claiming these as API client libraries
  would misrepresent what they are.
